<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookTracker</title>
    <link rel="icon" href="./img/Logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="img/Logo.png" alt="Logo">
            <h1>BookTracker</h1>
        </div>

        <nav>
            <a href="book_info.html">Mine bøker</a>
            <a href="hjelp.html">Hjelp</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Hold oversikt over lesingen din</h2>

            <p>Du har lest 12 bøker i år</p>
            <p>Gjennomsnittlig rating: 4.3 ⭐</p>

            <div class="hero-buttons">
                <a href="book_info.html">Mine bøker</a>
                <a>Legg til bok</a>
            </div>
        </section>

        <section class="stats">
            <div class="stat-card">
                <h3>24</h3>
                <p>Totalt bøker</p>
            </div>

            <div class="stat-card">
                <h3>4.3</h3>
                <p>Gjennomsnittlig rating</p>
            </div>

            <div class="stat-card">
                <h3>2</h3>
                <p>Leser nå</p>
            </div>
        </section>

        <section class="recent-books">
            <h2>Siste registrerte bøker</h2>

            <div class="book-card">
                Dune ★★★★★
            </div>

            <div class="book-card">
                Harry Potter ★★★★☆
            </div>

            <div class="book-card">
                The Hobbit ★★★★★
            </div>
        </section>

    </main>

    <footer>
        <a>Personvern</a>
        <a>FAQ</a>
    </footer>

</body>
</html>
