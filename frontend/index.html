<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookTracker</title>
    <link rel="icon" type="image/png" href="img/Logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html"><img src="img/Logo.png" alt="Logo"></a>
            <a href="index.html"><h1>BookTracker</h1></a>
        </div>

        <nav>
            <a href="mine_boker.html">Mine bøker</a>
            <a href="hjelp.html">Hjelp</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Hold oversikt over lesingen din</h2>

            <div class="hero-buttons">
                <a href="mine_boker.html">Mine bøker</a>
                <a href="#" id="openIndexModal">Legg til bok</a>
            </div>
        </section>

            <section class="stats">

                <div class="stat-card">
                    <h3 id="totalBooks">0</h3>
                    <p>Totalt bøker</p>
                </div>

                <div class="stat-card">
                    <h3 id="avgRating">0</h3>
                    <p>Gjennomsnittlig rating</p>
                </div>

                <div class="stat-card">
                    <h3 id="readingNow">0</h3>
                    <p>Leser nå</p>
                </div>

            </section>

            <section class="recent-books">
                <h2>Siste registrerte bøker</h2>

                <div id="recentBooks"></div>
            </section>

    </main>

    <!-- MODAL -->
    <div class="modal" id="indexModal">

        <div class="modal-content">

            <h2>Legg til ny bok</h2>

            <form id="indexBookForm">

                <label for="title">Boktittel</label>
                <input type="text" id="title" required>

                <label for="author">Forfatter</label>
                <input type="text" id="author" required>

                <label for="status">Status</label>
                <select id="status">
                    <option value="want_to_read">Vil lese</option>
                    <option value="reading">Leser</option>
                    <option value="finished">Har lest</option>
                </select>

                <label for="rating">Vurdering</label>
                <select id="rating">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <label for="review">Review</label>
                <textarea id="review" rows="4"></textarea>

                <div class="modal-buttons">
                    <button type="submit">Lagre</button>
                    <button type="button" id="closeIndexModal">Lukk</button>
                </div>

            </form>

        </div>

    </div>

    <footer>
        <p>&copy; 2026 BookTracker</p>
        <div>
        <a href="personvern.html">Personvern |</a>
        <a href="faq.html">FAQ</a>
        </div>
    </footer>

    <script src="js/index.js"></script>
</body>
</html>
