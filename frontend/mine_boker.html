<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Bøker | BookTracker</title>
    <link rel="stylesheet" href="mine-boker.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <a href="index.html"><img src="img/Logo.png" alt="Logo"></a>
            <a href="index.html"><h1>BookTracker</h1></a>
        </div>

        <nav>
            <a href="mine_boker.html">Mine bøker</a>
            <a href="hjelp.html">Hjelp</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

        <section class="page-header">
            <h1>Mine Bøker</h1>

            <button id="openModalBtn">
                + Legg til ny bok
            </button>
        </section>

        <!-- BOOK GRID -->
        <section class="books-grid">

            <article class="book-card">
                <h2>Harry Potter</h2>
                <p>J.K. Rowling</p>
            </article>

            <article class="book-card">
                <h2>Dune</h2>
                <p>Frank Herbert</p>
            </article>

            <article class="book-card">
                <h2>Hobbiten</h2>
                <p>J.R.R. Tolkien</p>
            </article>

        </section>

    </main>

    <!-- MODAL -->
    <div class="modal" id="bookModal">

        <div class="modal-content">

            <h2>Legg til ny bok</h2>

            <form id="bookForm">

                <label for="title">Boktittel</label>
                <input type="text" id="title" required>

                <label for="author">Forfatter</label>
                <input type="text" id="author" required>

                <label for="status">Status</label>
                <select id="status">
                    <option value="want_to_read">Vil lese</option>
                    <option value="reading">Leser</option>
                    <option value="finished">Har lest</option>
                </select>

                <label for="rating">Vurdering</label>
                <select id="rating">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <label for="review">Review</label>
                <textarea id="review" rows="4"></textarea>

                <div class="modal-buttons">
                    <button type="submit">Lagre</button>
                    <button type="button" id="closeModalBtn">Lukk</button>
                </div>

            </form>

        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 BookTracker</p>
        <div>
        <a>Personvern |</a>
        <a>FAQ</a>
        </div>
    </footer>

</body>
</html>
