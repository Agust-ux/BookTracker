<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Bøker | BookTracker</title>
    <link rel="icon" type="image/png" href="img/Logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mine_boker.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <a href="index.html"><img src="img/Logo.png" alt="Logo"></a>
            <a href="index.html"><h1>BookTracker</h1></a>
        </div>

        <nav>
            <a href="mine_boker.html">Mine bøker</a>
            <a href="hjelp.html">Hjelp</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

        <section class="page-header">
            <h1>Mine Bøker</h1>

            <button id="openModalBtn">
                + Legg til ny bok
            </button>
        </section>

        <!-- BOOK GRID -->
        <section class="books-grid" id="booksGrid">

        </section>

    </main>

    <!-- MODAL -->
<div class="modal" id="bookModal">

    <div class="modal-content">

        <h2 id="modalTitle">Legg til ny bok</h2>

        <form id="bookForm">

            <!-- IMPORTANT: used for EDIT mode -->
            <input type="hidden" id="bookId">

            <label for="title">Boktittel</label>
            <input type="text" id="title" required>

            <label for="author">Forfatter</label>
            <input type="text" id="author" required>

            <label for="status">Status</label>
            <select id="status" required>
                <option value="want_to_read">Vil lese</option>
                <option value="reading">Leser</option>
                <option value="finished">Har lest</option>
            </select>

            <label for="rating">Vurdering</label>
            <select id="rating">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>

            <label for="review">Review</label>
            <textarea id="review" rows="4" placeholder="Skriv din vurdering..."></textarea>

            <div class="modal-buttons">
                <button type="submit" id="saveBtn">Lagre</button>
                <button type="button" id="closeModalBtn">Lukk</button>
            </div>

        </form>

    </div>

</div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 BookTracker</p>
        <div>
        <a>Personvern |</a>
        <a>FAQ</a>
        </div>
    </footer>
</body>
    <script src="js/mineBoker.js"></script>

</html>
